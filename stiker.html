<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endeisme | Sticker Packs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Outfit:wght@300;400;700&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #bef264; color: black; overflow-x: hidden; }
        .heading-font { font-family: 'Archivo Black', sans-serif; }
        .sticker-card { background: white; border: 4px solid black; box-shadow: 10px 10px 0px black; transition: 0.2s; }
        .sticker-card:hover { transform: translate(-5px, -5px); box-shadow: 15px 15px 0px black; }
        
        /* Sidebar Keranjang Brutalist */
        .cart-sidebar { 
            transform: translateX(100%); 
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
            background: white;
            border-left: 5px solid black;
        }
        .cart-sidebar.open { transform: translateX(0); }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #bef264; }
        ::-webkit-scrollbar-thumb { background: black; border: 2px solid #bef264; }
    </style>
</head>
<body class="p-6">

    <nav class="max-w-6xl mx-auto flex justify-between items-center mb-20">
        <a href="index.html" class="heading-font text-3xl tracking-tighter uppercase italic underline decoration-4 underline-offset-4">Endeisme</a>
        <div class="flex items-center gap-4">
            <button onclick="toggleCart()" class="bg-black text-white px-6 py-2 font-black uppercase text-xs hover:bg-white hover:text-black border-2 border-black transition">
                Cart (<span id="cart-count">0</span>)
            </button>
            <a href="index.html" class="bg-white text-black border-2 border-black px-6 py-2 font-black uppercase text-xs hover:bg-black hover:text-white transition">Home</a>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto">
        <div class="mb-12">
            <h1 class="text-7xl md:text-9xl heading-font uppercase leading-[0.8]">STICKER<br>PACKS<span class="text-white">.</span></h1>
            <p class="mt-8 font-black uppercase tracking-widest bg-black text-white inline-block px-4 py-1">Limited Vinyl Material</p>
        </div>

        <div id="sticker-grid" class="grid grid-cols-1 md:grid-cols-2 gap-12 py-10">
            <div class="sticker-card p-6 flex flex-col md:flex-row gap-6">
                <div class="w-full md:w-1/2 aspect-square bg-zinc-200 border-2 border-black overflow-hidden">
                    <img src="img/stiker1.webp" class="w-full h-full object-cover">
                </div>
                <div class="w-full md:w-1/2 flex flex-col justify-between">
                    <div>
                        <h2 class="text-3xl heading-font uppercase leading-none mb-2 italic">Vandal Art Vol. 1</h2>
                        <p class="font-bold text-zinc-600 text-sm italic">Isi 15 pcs stiker vinyl laminasi matte. Anti air & anti badai.</p>
                    </div>
                    <div class="mt-6">
                        <p class="text-3xl font-black mb-4 font-mono underline underline-offset-4">IDR 45.000</p>
                        <button onclick="addToCart('Vandal Art Vol. 1', 45000, 'img/stiker1.webp')" class="w-full bg-black text-white py-3 font-black uppercase text-xs border-2 border-black hover:bg-[#bef264] hover:text-black transition">
                            Add To Cart +
                        </button>
                    </div>
                </div>
            </div>

            <div class="sticker-card p-6 flex flex-col md:flex-row gap-6">
                <div class="w-full md:w-1/2 aspect-square bg-zinc-200 border-2 border-black overflow-hidden">
                    <img src="img/stiker2.webp" class="w-full h-full object-cover">
                </div>
                <div class="w-full md:w-1/2 flex flex-col justify-between">
                    <div>
                        <h2 class="text-3xl heading-font uppercase leading-none mb-2 italic">Logo Evolution</h2>
                        <p class="font-bold text-zinc-600 text-sm italic">Isi 10 pcs stiker eksklusif logo Endeisme dari masa ke masa.</p>
                    </div>
                    <div class="mt-6">
                        <p class="text-3xl font-black mb-4 font-mono underline underline-offset-4">IDR 35.000</p>
                        <button onclick="addToCart('Logo Evolution', 35000, 'img/stiker2.webp')" class="w-full bg-black text-white py-3 font-black uppercase text-xs border-2 border-black hover:bg-[#bef264] hover:text-black transition">
                            Add To Cart +
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="cartSidebar" class="fixed top-0 right-0 h-full w-full md:w-96 z-[110] cart-sidebar shadow-2xl flex flex-col">
        <div class="p-6 border-b-4 border-black flex justify-between items-center bg-black text-white">
            <h2 class="heading-font text-xl uppercase">Your Stash.</h2>
            <button onclick="toggleCart()" class="font-black uppercase text-xs">Close ✕</button>
        </div>
        
        <div id="cart-items" class="flex-grow overflow-y-auto p-6 space-y-6 bg-white">
            </div>

        <div class="p-6 border-t-4 border-black bg-white">
            <div class="flex justify-between mb-6">
                <span class="font-black uppercase text-xs">Total</span>
                <span id="cart-total" class="heading-font text-2xl underline decoration-2">IDR 0</span>
            </div>
            <button onclick="checkoutWA()" class="w-full bg-[#bef264] text-black border-4 border-black py-4 font-black uppercase text-xs tracking-widest hover:bg-black hover:text-white transition duration-300 shadow-[5px_5px_0px_black]">
                Pesan via WhatsApp
            </button>
        </div>
    </div>

    <footer class="bg-zinc-950 border-t border-zinc-900 pt-20 pb-10 mt-20 text-white">
        <div class="max-w-7xl mx-auto px-6 text-center text-[10px] font-bold text-zinc-600 tracking-[0.2em] uppercase">
            © 2026 ENDEISME ART DIVISION.
        </div>
    </footer>

    <script>
        let cart = JSON.parse(localStorage.getItem('endeisme_stickers')) || [];

        // 1. Fungsi Tambah ke Keranjang
        function addToCart(title, price, img) {
            const existing = cart.find(item => item.title === title);
            if (existing) {
                existing.qty++;
            } else {
                cart.push({ title, price, img, qty: 1 });
            }
            saveAndUpdate();
            
            Swal.fire({
                title: 'STUCK!',
                text: `${title} masuk keranjang.`,
                icon: 'success',
                toast: true,
                position: 'top-end',
                showConfirmButton: false,
                timer: 2000,
                background: '#000',
                color: '#fff',
                iconColor: '#bef264'
            });
            
            toggleCart(true);
        }

        // 2. Simpan Data
        function saveAndUpdate() {
            localStorage.setItem('endeisme_stickers', JSON.stringify(cart));
            renderCart();
        }

        // 3. Tampilkan Keranjang
        function renderCart() {
            const container = document.getElementById('cart-items');
            const countEl = document.getElementById('cart-count');
            const totalEl = document.getElementById('cart-total');
            
            container.innerHTML = '';
            let total = 0;
            let count = 0;

            cart.forEach((item, index) => {
                total += item.price * item.qty;
                count += item.qty;
                container.innerHTML += `
                    <div class="flex gap-4 items-center border-2 border-black p-3 bg-zinc-50 shadow-[4px_4px_0px_black]">
                        <img src="${item.img}" class="w-16 h-16 object-cover border-2 border-black">
                        <div class="flex-grow">
                            <h4 class="text-xs font-black uppercase leading-tight">${item.title}</h4>
                            <p class="text-xs font-bold mt-1 italic">IDR ${item.price.toLocaleString('id-ID')}</p>
                            <button onclick="removeFromCart(${index})" class="text-[9px] font-black uppercase text-red-600 underline mt-1">Remove</button>
                        </div>
                        <div class="flex flex-col items-center border-l-2 border-black pl-3">
                            <button onclick="changeQty(${index}, 1)" class="font-bold text-lg">+</button>
                            <span class="font-mono text-sm">${item.qty}</span>
                            <button onclick="changeQty(${index}, -1)" class="font-bold text-lg">-</button>
                        </div>
                    </div>
                `;
            });

            if(cart.length === 0) {
                container.innerHTML = `<div class="text-center py-10 opacity-30 font-black uppercase italic">Empty Stash</div>`;
            }

            countEl.innerText = count;
            totalEl.innerText = 'IDR ' + total.toLocaleString('id-ID');
        }

        function changeQty(index, delta) {
            cart[index].qty += delta;
            if (cart[index].qty < 1) return removeFromCart(index);
            saveAndUpdate();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            saveAndUpdate();
        }

        function toggleCart(open = null) {
            const sidebar = document.getElementById('cartSidebar');
            if (open === true) sidebar.classList.add('open');
            else if (open === false) sidebar.classList.remove('open');
            else sidebar.classList.toggle('open');
        }

        // 4. Checkout WhatsApp (Otomatis Preview Gambar via Vercel)
        async function checkoutWA() {
            if (cart.length === 0) return;

            const { value: name } = await Swal.fire({
                title: 'SIAPA NAMAMU?',
                input: 'text',
                background: '#fff',
                color: '#000',
                confirmButtonColor: '#000',
                confirmButtonText: 'KIRIM KE WA',
                inputValidator: (v) => !v && 'Isi dulu bos!'
            });

            if (name) {
                const phone = "6285161182132";
                let message = `*STICKER ORDER - ENDEISME*\n--------------------------\n*Nama:* ${name}\n\n`;
                
                cart.forEach((item, i) => {
                    // Logic URL Vercel untuk preview gambar
                    const imgFullUrl = `${window.location.origin}/${item.img}`;
                    message += `${i+1}. *${item.title}* (${item.qty}x)\n`;
                    message += `   Link: ${imgFullUrl}\n\n`;
                });

                let total = cart.reduce((a, b) => a + (b.price * b.qty), 0);
                message += `--------------------------\n*TOTAL: IDR ${total.toLocaleString('id-ID')}*`;

                window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`, '_blank');
            }
        }

        // Start
        renderCart();
    </script>
</body>
</html>
